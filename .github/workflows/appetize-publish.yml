name: Appetize Publish
on:
  push:
    branches:
      - main
  pull_request:

# Runs on main never share a group, so no merge's publish is cancelled.
concurrency:
  group: appetize-publish-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  types:
    name: idb types package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Pull requests build and validate the package without publishing it.
      - name: Build
        run: pnpm run build
      - name: Validate
        run: pnpm run validate
      - name: Set the version
        run: pnpm run version "$GITHUB_RUN_NUMBER"
      - name: Publish
        if: github.event_name == 'push' && github.repository == 'appetizeio/idb'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          pnpm config set --global "//npm.pkg.github.com/:_authToken" '${NODE_AUTH_TOKEN}'
          pnpm run release
